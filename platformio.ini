; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-16mb-psram]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1-16mb-psram
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBRYG_RGB_LED_GPIO=48
; Original DevKitC-1 uses 48; official revision 1.1 uses 38.
; This board definition requires 16 MB QIO flash and 8 MB OPI PSRAM.
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.7
	adafruit/Adafruit MAX31865 library@1.6.2
	arduino-libraries/NTPClient@^3.2.1
monitor_speed = 115200
upload_speed = 115200

extra_scripts = pre:scripts/generate_version.py
